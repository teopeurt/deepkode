# helmsman — dsh engine composition (granular spine + ACP control channel)
# Observation channel: tailing the JSONL session logs (.sessions/) —— model-visible ⟺ logged is the authoritative event source.
# No session-query: an architectural decision (see architecture-v1.md §2.1); the demo bundle's derived index is not used.

# User settings ($DSH_HOME/settings.yaml, hot-reloaded)
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# Credential store: process environment over $DSH_HOME/.credentials.yaml; DEEPSEEK_API_KEY is resolved here, never inlined.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
        contextWindow: 128000
      - id: deepseek-v4-pro
        contextWindow: 128000

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    timeoutMs: 60000

# Spine bundle: no pre-built agents (ACP creates one per session/new); the persona is the helmsman identity.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are Helmsman, a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      You execute one task per session; the task brief arrives as the first user message and is authoritative. Verify your work by running code or tests. Keep answers brief and factual. When a task depends on project knowledge you lack, say so instead of guessing.

# JSONL session logs: the data source of the observation channel (tailed on the Rust side).
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.HELMSMAN_SESSIONS_ROOT ?? './.sessions'"
    compression: !!js "process.env.HELMSMAN_COMPRESSION ?? 'none'"

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compact-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable
    maxDepth: 1

- id: workflow-workerthread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Per-project sandbox: workspace-write —— each task's (session's) write root = the session cwd (the project directory the user picked);
# it can only write its own project directory + /tmp, never other projects or arbitrary system locations (spec: tasks are isolated per project).
# Public release (0.1.0-rc.7): fs-sandbox replaces fs-local outright (they no longer coexist), paired with ctx.sandboxPolicy.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js "process.env.HELMSMAN_WORKSPACE ?? process.cwd()"

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'


# Command-level allowlist (P1): the tool-approval seam —— when the guard preset matches a dangerous command and returns ask,
# it is routed via the approval/request waterfall to the dsh-acp bridge → ACP requestPermission → the Helmsman approval queue.
# Without an answerer it fails closed (the command is rejected, never silently allowed).
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask


# Preset roster (P0 presets): each task can mount different tools/personas via _meta.agentPreset.
# Roots = this repo's presets (system) + ~/.dsh/.agent-presets (user, appended automatically).
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    # default: engine presets are only an optional tool-set customization (the main Profile path has the product service resolve the three axes; nothing is mounted when no presetId is passed);
    # the schema requires default, so code-concise is a placeholder (harmless: it has no effect unless the product service passes it).
    default: code-concise
    roots:
      - path: !!js "process.cwd() + '/agent-presets'"
        trust: system

# ACP control channel (stdin/stdout): the control plane of the Rust product service.
# the selected model → installModelSelection attaches it to the agent's request routing (takes effect next turn).
- id: model-select
  name: ./model-select.js
# D3-1 gateway: in-engine HTTP server (reusing the official webserver)
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: 3082

- id: helmsman-gateway
  name: ./helmsman-gateway.js
